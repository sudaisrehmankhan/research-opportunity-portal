<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My profile | Research Opportunity Portal</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header><div class="container"><h1>My profile</h1></div></header>
    <main class="container narrow">
      <section class="panel">
        {% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}
        <p>Account type: <strong>{{ profile.get_role_display }}</strong></p>
        <form method="post" class="form-grid">
          {% csrf_token %}
          <label>Username <input value="{{ request.user.username }}" disabled></label>
          <label>First name <input name="first_name" value="{{ request.user.first_name }}" required></label>
          <label>Last name <input name="last_name" value="{{ request.user.last_name }}" required></label>
          <label>Email <input type="email" name="email" value="{{ request.user.email }}" required></label>
          <label>Phone <input name="phone" value="{{ profile.phone }}"></label>
          {% if profile.role == 'student' %}
            <label>Student ID <input value="{{ profile.student_number }}" disabled></label>
            <label>Program <input name="program" value="{{ profile.program }}"></label>
          {% else %}
            <label>Position title <input name="position_title" value="{{ profile.position_title }}"></label>
            <label>Department <input value="{{ profile.department }}" disabled></label>
          {% endif %}
          <button class="primary-btn" type="submit">Save profile</button>
        </form>
        <p><a href="{% url 'dashboard' %}">Return to dashboard</a></p>
      </section>
    </main>
  </body>
</html>
